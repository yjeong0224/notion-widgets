function stats(){let g=grammarGroups.reduce((n,s)=>n+s[1].length,0),gd=Object.values(state.gramDone).filter(Boolean).length,vd=Object.values(state.vocDone).filter(Boolean).length,stars=Object.values(state.starred).filter(Boolean).length;$('stats').innerHTML=`<div class="stat">문법 <b>${gd}/${g}</b></div><div class="stat">주제별 단어 <b>${vd}/${vocabGroups.length}</b></div><div class="stat">개인 오답 <b>${state.personal.length}</b>개</div><div class="stat">집중 오답 <b>${stars}</b>개</div>`}
function gramRender(){let idx=0,html='';grammarGroups.forEach(([title,lessons],gi)=>{const open=!!state.groupOpen[gi],done=lessons.filter((_,li)=>state.gramDone[key(gi,li)]).length;html+=`<div class="section"><div class="secthead" data-group="${gi}"><strong>${gi+1}단원 · ${esc(title)}</strong><span class="meta">${done}/${lessons.length} · ${open?'▴':'▾'}</span></div><div class="sectbody" ${open?'':'hidden'}>`;lessons.forEach(([name,rule,ex],li)=>{let k=key(gi,li),o=!!state.gramOpen[k];idx++;html+=`<div class="lesson"><div class="lessonhead"><input aria-label="학습 완료" type="checkbox" data-gdone="${k}" ${state.gramDone[k]?'checked':''}><span class="meta">D${String(idx).padStart(2,'0')}</span><span class="lessonname" data-lesson="${k}">${esc(name)}</span><span class="meta" data-lesson="${k}">${o?'▴':'▾'}</span></div><div class="detail" ${o?'':'hidden'}><div><b>핵심</b> · ${esc(rule)}</div><div class="example">${esc(ex)}</div><label><input type="checkbox" data-greview="${k}" ${state.gramReview[k]?'checked':''}>복습 완료</label><textarea class="note" data-gnote="${k}" placeholder="학습 내용 / 헷갈린 점 / 내 예문">${esc(state.gramNotes[k]||'')}</textarea></div></div>`});html+='</div></div>'});$('grammarContent').innerHTML=html}

function personalRender(){let showEn=state.visibility.pEn,showKo=state.visibility.pKo;$('personalToggleEn').textContent=(showEn?'◉':'⊘')+' 영어';$('personalToggleKo').textContent=(showKo?'◉':'⊘')+' 한국어';$('personalCount').textContent=state.personal.length+'개 기록';$('personalWords').innerHTML=state.personal.length?`<table class="wordtable"><thead><tr><th style="width:38%">영어</th><th>한국어</th><th style="width:70px">관리</th></tr></thead><tbody>${state.personal.map((w,i)=>`<tr><td>${showEn?esc(w.en):'<span class="muted">••••••</span>'}</td><td>${showKo?esc(w.ko):'<span class="muted">••••••</span>'}</td><td><button class="tiny ${state.starred['p'+w.id]?'selected':''}" data-star="p${w.id}">${state.starred['p'+w.id]?'★':'☆'}</button> <button class="tiny" data-delperson="${w.id}">×</button></td></tr>`).join('')}</tbody></table>`:'<div class="meta">아직 기록한 단어가 없어.</div>'}
function errorRender(){let arr=[];vocabGroups.forEach(([title,words],i)=>{[...words,...(state.vocExtra[i]||[])].forEach(([en,ko],j)=>{let id='v'+i+'_'+j;if(state.starred[id])arr.push({id,en,ko,src:title})})});state.personal.forEach(w=>{let id='p'+w.id;if(state.starred[id])arr.push({id,en:w.en,ko:w.ko,src:'개인 단어장'})});$('errorEn').textContent=(state.visibility.eEn?'◉':'⊘')+' 영어';$('errorKo').textContent=(state.visibility.eKo?'◉':'⊘')+' 한국어';$('errorContent').innerHTML=arr.length?`<div class="pinned">${arr.map(w=>`<div class="pinitem"><div class="pintext"><b>${state.visibility.eEn?esc(w.en):'••••••'}</b> · ${state.visibility.eKo?esc(w.ko):'••••••'}<div class="meta">${esc(w.src)}</div></div><button class="tiny selected" data-star="${w.id}" title="오답 해제">★</button></div>`).join('')}</div>`:'<div class="meta">아직 별표로 표시한 단어가 없어.</div>'}
function phraseRender(){const items=state.phrases||[];const en=state.visibility.phEn!==false,ko=state.visibility.phKo!==false;$('phraseCount').textContent=`${items.length}개`;$('phraseHideEn').textContent=(en?'◉':'⊘')+' 영어';$('phraseHideKo').textContent=(ko?'◉':'⊘')+' 한국어';$('phraseList').innerHTML=items.length?items.map((w)=>`<div class="phrase-row"><div class="phrase-en">${en?esc(w.en):'••••••'}</div><div class="phrase-ko">${ko?esc(w.ko):'••••••'}</div><div class="phrase-tools"><span class="push"></span><label class="meta"><input type="checkbox" data-phraseReview="${w.id}" ${w.review?'checked':''}>암기 완료</label><button class="tiny" data-phraseDelete="${w.id}">삭제</button></div><textarea class="phrase-note" data-phraseNote="${w.id}" placeholder="발음, 사용 상황, 나만의 예문 메모">${esc(w.note||'')}</textarea></div>`).join(''):'<div class="phrase-empty">아직 저장한 표현이 없어. 강의를 들으며 유용한 문장을 추가해 봐.</div>'}

function calendarRender(){let [year,month]=calendarMonth.split('-').map(Number),first=new Date(year,month-1,1).getDay(),total=new Date(year,month,0).getDate();let html=`<div class="calendar-header"><button class="tiny" data-cal-nav="-1" aria-label="이전 달">‹</button><b>${year}년 ${month}월</b><button class="tiny" data-cal-nav="1" aria-label="다음 달">›</button><button class="tiny" data-cal-today="1">오늘</button></div><div class="calendar-grid">`;

for(let d=1;d<=total;d++){let id=calendarMonth+'-'+String(d).padStart(2,'0'),n=dayCount(id),classes=['cal-day',id===selectedStudyDate?'chosen':'',id===today()?'is-today':''].join(' ');html+=`<button class="${classes}" data-cal-day="${id}" aria-label="${id}, ${n}개 완료">${d}${n?'<small class="cal-dot">●</small>':''}</button>`}
$('studyCalendar').innerHTML=html+'</div><div class="meta">● 체크한 기록이 있는 날 · 날짜를 눌러 이전 체크리스트 확인 및 수정</div>'}

function render(){stats();gramRender();vocabRender();personalRender();errorRender();homeRender();phraseRender()};
$('addPhrase').onclick=()=>{const en=$('phraseEn').value.trim(),ko=$('phraseKo').value.trim();if(!en||!ko)return alert('영어 문장과 뜻을 모두 입력해 줘.');(state.phrases??=[]).unshift({id:Date.now()+Math.random().toString(36).slice(2),en,ko,review:false,note:''});$('phraseEn').value='';$('phraseKo').value='';save();phraseRender()};$('phraseKo').addEventListener('keydown',e=>{if(e.key==='Enter')$('addPhrase').click()});$('phraseHideEn').onclick=()=>{state.visibility.phEn=state.visibility.phEn===false;save();phraseRender()};$('phraseHideKo').onclick=()=>{state.visibility.phKo=state.visibility.phKo===false;save();phraseRender()};$('personalDate').value=today();document.addEventListener('click',e=>{let b=e.target.closest('button,[data-group],[data-vgroup],[data-lesson]');if(!b)return;let ds=b.dataset;if(ds.calDay!==undefined){selectedStudyDate=ds.calDay;$('studyCalendar').hidden=true;$('dateTrigger').setAttribute('aria-expanded','false');homeRender();return}if(ds.calNav!==undefined){let [y,m]=calendarMonth.split('-').map(Number),next=new Date(y,m-1+Number(ds.calNav),1);calendarMonth=next.getFullYear()+'-'+String(next.getMonth()+1).padStart(2,'0');calendarRender();return}if(ds.calToday!==undefined){selectedStudyDate=today();calendarMonth=selectedStudyDate.slice(0,7);$('studyCalendar').hidden=true;$('dateTrigger').setAttribute('aria-expanded','false');homeRender();return}if(ds.tab){document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('selected',x===b));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.id===ds.tab));return}if(ds.group!==undefined){state.groupOpen[ds.group]=!state.groupOpen[ds.group];save();gramRender();return}if(ds.vgroup!==undefined){state.groupOpen['v'+ds.vgroup]=!state.groupOpen['v'+ds.vgroup];save();vocabRender();return}if(ds.lesson!==undefined){state.gramOpen[ds.lesson]=!state.gramOpen[ds.lesson];save();gramRender();return}if(ds.vEn!==undefined){let k='en'+ds.vEn;state.visibility[k]=state.visibility[k]===false;save();vocabRender();return}if(ds.vKo!==undefined){let k='ko'+ds.vKo;state.visibility[k]=state.visibility[k]===false;save();vocabRender();return}if(ds.addv!==undefined){let i=ds.addv,p=$('vocabContent'),en=p.querySelector(`[data-newen="${i}"]`).value.trim(),ko=p.querySelector(`[data-newko="${i}"]`).value.trim();if(!en||!ko)return alert('영어와 한국어를 모두 입력해 줘.');(state.vocExtra[i]??=[]).push([en,ko]);save();vocabRender();return}if(ds.star!==undefined){state.starred[ds.star]=!state.starred[ds.star];save();vocabRender();personalRender();errorRender();stats();return}if(ds.phraseDelete!==undefined){if(!confirm('이 표현을 삭제할까?'))return;state.phrases=(state.phrases||[]).filter(w=>String(w.id)!==ds.phraseDelete);save();phraseRender();return}if(ds.delperson!==undefined){if(!confirm('이 단어를 삭제할까?'))return;state.personal=state.personal.filter(w=>String(w.id)!==ds.delperson);delete state.starred['p'+ds.delperson];save();personalRender();errorRender();stats();return}});
document.addEventListener('change',e=>{let d=e.target.dataset;if(d.gdone!==undefined){state.gramDone[d.gdone]=e.target.checked;save();stats();return}if(d.greview!==undefined){state.gramReview[d.greview]=e.target.checked;save();return}if(d.vdone!==undefined){state.vocDone[d.vdone]=e.target.checked;save();stats();return}if(d.phraseReview!==undefined){let w=(state.phrases||[]).find(w=>String(w.id)===d.phraseReview);if(w){w.review=e.target.checked;save()}return}if(d.check!==undefined){let t=selectedStudyDate;(state.checks[t]??={})[d.check]=e.target.checked;save();homeRender();return}});
document.addEventListener('input',e=>{let d=e.target.dataset;if(d.phraseNote!==undefined){let w=(state.phrases||[]).find(w=>String(w.id)===d.phraseNote);if(w){w.note=e.target.value;save()}return}if(d.gnote!==undefined){state.gramNotes[d.gnote]=e.target.value;save()}if(d.vnote!==undefined){(state.vocNotes??={})[d.vnote]=e.target.value;save()}});$('resetdaily').onclick=()=>{if(confirm(selectedStudyDate+'의 체크를 초기화할까?')){delete state.checks[selectedStudyDate];save();homeRender()}};$('dateTrigger').onclick=()=>{let el=$('studyCalendar');el.hidden=!el.hidden;$('dateTrigger').setAttribute('aria-expanded',String(!el.hidden));calendarRender()};$('allEn').onclick=()=>{let hide=vocabGroups.every((_,i)=>state.visibility['en'+i]!==false);vocabGroups.forEach((_,i)=>state.visibility['en'+i]=!hide);save();vocabRender()};$('allKo').onclick=()=>{let hide=vocabGroups.every((_,i)=>state.visibility['ko'+i]!==false);vocabGroups.forEach((_,i)=>state.visibility['ko'+i]=!hide);save();vocabRender()};$('expandGrammar').onclick=()=>{grammarGroups.forEach((_,i)=>state.groupOpen[i]=true);save();gramRender()};$('collapseGrammar').onclick=()=>{grammarGroups.forEach((_,i)=>state.groupOpen[i]=false);save();gramRender()};$('personalToggleEn').onclick=()=>{state.visibility.pEn=!state.visibility.pEn;save();personalRender()};$('personalToggleKo').onclick=()=>{state.visibility.pKo=!state.visibility.pKo;save();personalRender()};$('errorEn').onclick=()=>{state.visibility.eEn=!state.visibility.eEn;save();errorRender()};$('errorKo').onclick=()=>{state.visibility.eKo=!state.visibility.eKo;save();errorRender()};$('addPersonal').onclick=()=>{let en=$('personalEn').value.trim(),ko=$('personalKo').value.trim();if(!en||!ko)return alert('영어와 한국어를 모두 입력해 줘.');state.personal.push({id:Date.now()+Math.random().toString(36).slice(2),en,ko,date:$('personalDate').value});$('personalEn').value='';$('personalKo').value='';save();personalRender();stats()};$('personalKo').addEventListener('keydown',e=>{if(e.key==='Enter')$('addPersonal').click()});$('export').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='english-study-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!obj.data||!Array.isArray(obj.data.personal))throw Error('잘못된 백업 파일');if(confirm('현재 기록을 백업 내용으로 교체할까?')){state={...structuredClone(base),...obj.data};save();render()}}catch(err){alert('백업 파일을 읽을 수 없어.')}e.target.value=''};render();
</script></body></html>
