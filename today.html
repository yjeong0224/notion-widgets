<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘의 할 일</title><link rel="stylesheet" href="shared.css"></head><body>
<div class="widget">
  <div class="header">
    <div style="min-width:0">
      <div class="title">오늘의 할 일</div>
      <div class="date-nav-row">
        <button class="date-nav-btn" id="prev" aria-label="이전 날">‹</button>
        <button class="period-btn" id="period"></button>
        <button class="date-nav-btn" id="next" aria-label="다음 날">›</button>
      </div>
    </div>
    <div class="progress" id="progress">0% · 0/0</div>
  </div>

  <div class="list" id="list"></div>

  <div class="compact-add">
    <button class="add-link" id="addLink">＋ 추가하기</button>
    <div class="compact-input-wrap" id="inputWrap">
      <input id="newItem" placeholder="할 일 입력">
      <button id="add">추가</button>
    </div>
  </div>

  <input class="hidden-picker" id="picker" type="date">
</div>

<script src="shared.js"></script><script>
let cursor=new Date();

const period=document.getElementById('period');
const picker=document.getElementById('picker');
const addLink=document.getElementById('addLink');
const inputWrap=document.getElementById('inputWrap');
const newItem=document.getElementById('newItem');
const add=document.getElementById('add');
const list=document.getElementById('list');
const progress=document.getElementById('progress');

const key=()=>`nw:v8:today:${W.ymd(cursor)}`;

const ctrl=W.listController({
  listEl:list,
  inputEl:newItem,
  addEl:add,
  keyFn:key,
  kindFn:()=> 'today',
  onChange:items=>{
    const d=items.filter(x=>x.done).length;
    progress.textContent=`${items.length?Math.round(d/items.length*100):0}% · ${d}/${items.length}`;
  }
});

function draw(){
  period.innerHTML=W.fmtDate(cursor)+(W.ymd(cursor)===W.ymd(new Date())?' <span class="today-chip">오늘</span>':'');
  ctrl.render();
}

document.getElementById('prev').onclick=()=>{cursor=W.addDays(cursor,-1);draw()};
document.getElementById('next').onclick=()=>{cursor=W.addDays(cursor,1);draw()};

period.onclick=()=>W.showPicker(picker,cursor);
picker.onchange=()=>{
  if(picker.value){
    const [y,m,d]=picker.value.split('-').map(Number);
    cursor=new Date(y,m-1,d);
    draw();
  }
};

addLink.onclick=()=>{
  inputWrap.classList.toggle('open');
  if(inputWrap.classList.contains('open')) setTimeout(()=>newItem.focus(),0);
};

newItem.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    inputWrap.classList.remove('open');
    newItem.value='';
  }
});

draw();
</script></body></html>
