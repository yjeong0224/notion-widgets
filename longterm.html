<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>장기 목표</title><link rel="stylesheet" href="shared.css"></head><body>
<div class="widget" id="widget">
  <div class="header">
    <div>
      <div class="title">장기 목표</div>
      <button class="period-btn" id="period"></button>
    </div>
    <div class="progress" id="progress">0% · 0/0</div>
  </div>

  <div class="tabs">
    <button class="tab active" data-mode="month">이번 달</button>
    <button class="tab" data-mode="year">올해</button>
  </div>

  <div class="period-popover" id="periodPopover"></div>

  <div class="list" id="list"></div>

  <div class="compact-add">
    <button class="add-link" id="addLink">＋ 추가하기</button>
    <div class="compact-input-wrap" id="inputWrap">
      <input id="newItem" placeholder="목표 입력">
      <button id="add">추가</button>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
let mode='month';
let cursor=new Date();

const period=document.getElementById('period');
const popover=document.getElementById('periodPopover');
const addLink=document.getElementById('addLink');
const inputWrap=document.getElementById('inputWrap');
const newItem=document.getElementById('newItem');
const add=document.getElementById('add');
const list=document.getElementById('list');
const progress=document.getElementById('progress');

const key=()=> mode==='month'
  ? `nw:v8:longterm:month:${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}`
  : `nw:v8:longterm:year:${cursor.getFullYear()}`;

const ctrl=W.listController({
  listEl:list,
  inputEl:newItem,
  addEl:add,
  keyFn:key,
  kindFn:()=>mode,
  onChange:items=>{
    const d=items.filter(x=>x.done).length;
    progress.textContent=`${items.length?Math.round(d/items.length*100):0}% · ${d}/${items.length}`;
  }
});

function draw(){
  period.textContent=mode==='month'?W.fmtMonth(cursor):W.fmtYear(cursor);
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  ctrl.render();
  closePopover();
}

function closePopover(){
  popover.classList.remove('open');
}

function renderMonthPicker(){
  const y=cursor.getFullYear();
  popover.innerHTML = `
    <div class="popover-head">
      <button class="popover-nav" id="prevYear">‹</button>
      <span>${y}년</span>
      <button class="popover-nav" id="nextYear">›</button>
    </div>
    <div class="month-grid">
      ${Array.from({length:12},(_,i)=>`
        <button class="month-btn ${i===cursor.getMonth()?'active':''}" data-month="${i}">
          ${i+1}월
        </button>`).join('')}
    </div>`;
  popover.classList.add('open');

  document.getElementById('prevYear').onclick=(e)=>{
    e.stopPropagation();
    cursor=new Date(y-1,cursor.getMonth(),1);
    renderMonthPicker();
  };
  document.getElementById('nextYear').onclick=(e)=>{
    e.stopPropagation();
    cursor=new Date(y+1,cursor.getMonth(),1);
    renderMonthPicker();
  };
  popover.querySelectorAll('.month-btn').forEach(btn=>{
    btn.onclick=(e)=>{
      e.stopPropagation();
      cursor=new Date(cursor.getFullYear(),Number(btn.dataset.month),1);
      draw();
    };
  });
}

function renderYearPicker(){
  const current=cursor.getFullYear();
  const start=current-4;
  popover.innerHTML = `
    <div class="popover-head">
      <button class="popover-nav" id="prevYears">‹</button>
      <span>${start}–${start+8}</span>
      <button class="popover-nav" id="nextYears">›</button>
    </div>
    <div class="year-grid">
      ${Array.from({length:9},(_,i)=>{
        const y=start+i;
        return `<button class="year-btn ${y===current?'active':''}" data-year="${y}">${y}</button>`;
      }).join('')}
    </div>`;
  popover.classList.add('open');

  document.getElementById('prevYears').onclick=(e)=>{
    e.stopPropagation();
    cursor=new Date(current-9,0,1);
    renderYearPicker();
  };
  document.getElementById('nextYears').onclick=(e)=>{
    e.stopPropagation();
    cursor=new Date(current+9,0,1);
    renderYearPicker();
  };
  popover.querySelectorAll('.year-btn').forEach(btn=>{
    btn.onclick=(e)=>{
      e.stopPropagation();
      cursor=new Date(Number(btn.dataset.year),0,1);
      draw();
    };
  });
}

period.onclick=(e)=>{
  e.stopPropagation();
  if(popover.classList.contains('open')){
    closePopover();
    return;
  }
  mode==='month' ? renderMonthPicker() : renderYearPicker();
};

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  mode=b.dataset.mode;
  cursor=new Date();
  draw();
});

addLink.onclick=()=>{
  inputWrap.classList.toggle('open');
  if(inputWrap.classList.contains('open')){
    setTimeout(()=>newItem.focus(),0);
  }
};

newItem.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    inputWrap.classList.remove('open');
    newItem.value='';
  }
});

document.addEventListener('click',e=>{
  if(!popover.contains(e.target) && e.target!==period) closePopover();
});

draw();
</script></body></html>
